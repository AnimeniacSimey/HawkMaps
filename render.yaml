# Render Blueprint — deploys the GoldenHawk AI backend as a free web service.
# Deploy: render.com → New → Blueprint → connect this repo. Then set GROQ_API_KEY
# in the service's Environment tab (it is intentionally NOT stored in the repo).
# See backend/DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: hawkmaps-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY        # set this in the Render dashboard (secret) — do NOT commit
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
