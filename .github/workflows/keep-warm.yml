# Keeps the free-tier Render backend awake so GoldenHawk AI has no ~30-50s
# cold-start delay. Pings the health endpoint on a schedule. Free for the repo.
# Note: GitHub's scheduled runs can be delayed a few minutes under load; for
# rock-solid warmth, also add an UptimeRobot monitor (5-min interval).
name: keep-warm

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch: {}        # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GoldenHawk AI health
        run: |
          curl -sS -m 90 https://hawkmaps-api.onrender.com/api/health || true
